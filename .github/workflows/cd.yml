name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-backend-artifacts:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        runtime: [linux-x64, win-x64, osx-x64, osx-arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore projects
        run: |
          dotnet restore Eventask.ApiService/Eventask.ApiService.csproj -r ${{ matrix.runtime }}
          dotnet restore Eventask.ApiService.MigrationWorker/Eventask.ApiService.MigrationWorker.csproj -r ${{ matrix.runtime }}

      - name: Publish API service (self-contained single-file)
        run: dotnet publish Eventask.ApiService/Eventask.ApiService.csproj -c Release -r ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./artifacts/api-service-${{ matrix.runtime }}

      - name: Publish migration worker (self-contained single-file)
        run: dotnet publish Eventask.ApiService.MigrationWorker/Eventask.ApiService.MigrationWorker.csproj -c Release -r ${{ matrix.runtime }} --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -p:ErrorOnDuplicatePublishOutputFiles=false -o ./artifacts/migration-worker-${{ matrix.runtime }}

      - name: Archive artifacts
        run: |
          tar -czf api-service-${{ matrix.runtime }}.tar.gz -C ./artifacts api-service-${{ matrix.runtime }}
          tar -czf migration-worker-${{ matrix.runtime }}.tar.gz -C ./artifacts migration-worker-${{ matrix.runtime }}

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-service-${{ matrix.runtime }}-${{ github.sha }}
          path: ./api-service-${{ matrix.runtime }}.tar.gz

      - name: Upload migration worker artifact
        uses: actions/upload-artifact@v4
        with:
          name: migration-worker-${{ matrix.runtime }}-${{ github.sha }}
          path: ./migration-worker-${{ matrix.runtime }}.tar.gz
